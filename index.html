<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Excel - Spreadsheet</title>

<style>
* { box-sizing: border-box; }

:root {
  --green: #217346;
  --border: #d5d9de;
  --header: #f2f4f6;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff;
  color: #222;
  font-size: 13px;
}

.topbar {
  background: var(--green);
  color: white;
  padding: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.brand {
  font-size: 19px;
  font-weight: bold;
}

.subtitle {
  font-size: 11px;
  margin-top: 4px;
  opacity: .9;
}

button, select {
  font: inherit;
}

button {
  border: 1px solid #c9ced3;
  border-radius: 4px;
  background: white;
  padding: 7px 10px;
  cursor: pointer;
  color: #222;
}

button:active { background: #dcebe2; }

.top-actions {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.top-actions button {
  color: white;
  background: #2e8558;
  border-color: #77ad8c;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding: 8px;
  border-bottom: 1px solid var(--border);
  align-items: center;
}

.toolbar button {
  min-width: 32px;
  min-height: 32px;
}

.toolbar select {
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0 5px;
  max-width: 125px;
}

.color-control {
  display: flex;
  align-items: center;
  gap: 4px;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px;
  height: 32px;
}

.color-control input {
  width: 23px;
  height: 23px;
  padding: 0;
  border: none;
}

.formula-area {
  display: flex;
  align-items: stretch;
  gap: 6px;
  padding: 8px;
  border-bottom: 1px solid var(--border);
}

.name-box {
  width: 64px;
  text-align: center;
  padding: 9px 2px;
  background: var(--header);
  border: 1px solid var(--border);
  border-radius: 3px;
  font-weight: bold;
}

.fx {
  padding: 9px 2px;
  font-weight: bold;
  color: #666;
  font-style: italic;
}

.formula-input {
  min-width: 0;
  flex: 1;
  border: 1px solid var(--border);
  padding: 8px;
  outline-color: var(--green);
  border-radius: 3px;
}

.sheet-info {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 10px;
  color: #555;
  font-size: 11px;
}

.grid-container {
  overflow: auto;
  height: calc(100dvh - 255px);
  min-height: 300px;
  -webkit-overflow-scrolling: touch;
}

table {
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
  width: max-content;
  min-width: 100%;
}

th, td {
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  height: 29px;
  padding: 4px 7px;
  overflow: hidden;
  white-space: nowrap;
}

thead th {
  position: sticky;
  top: 0;
  z-index: 3;
  background: var(--header);
  text-align: center;
  font-weight: normal;
  border-top: 1px solid var(--border);
}

.corner {
  left: 0;
  z-index: 5 !important;
  width: 42px;
  min-width: 42px;
}

.row-head {
  position: sticky;
  left: 0;
  z-index: 2;
  background: var(--header);
  text-align: center;
  width: 42px;
  min-width: 42px;
  font-weight: normal;
}

td {
  width: 110px;
  min-width: 110px;
  background: white;
  outline: none;
}

td.selected {
  position: relative;
  outline: 2px solid var(--green);
  outline-offset: -2px;
  z-index: 1;
}

td:focus {
  outline: 2px solid var(--green);
  outline-offset: -2px;
}

.tabs {
  display: flex;
  align-items: center;
  gap: 0;
  border-top: 1px solid var(--border);
  background: #f6f7f8;
  padding: 4px 8px;
  overflow-x: auto;
}

.tabs button {
  border-radius: 0;
  border: none;
  border-bottom: 3px solid transparent;
  background: transparent;
  white-space: nowrap;
}

.tabs button.active {
  background: white;
  border-bottom-color: var(--green);
  color: var(--green);
  font-weight: bold;
}

.status {
  padding: 7px 10px;
  font-size: 11px;
  color: #555;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.hint {
  background: #f5f8f6;
  padding: 8px 10px;
  border-top: 1px solid #e0e8e3;
  color: #52645a;
  font-size: 11px;
}

@media (max-width: 600px) {
  .brand { font-size: 17px; }
  .topbar { padding: 10px 8px; }
  .toolbar { gap: 4px; padding: 6px; }
  .toolbar button { padding: 6px 8px; }
  .grid-container { height: calc(100dvh - 265px); }
}
</style>
</head>

<body>

<header class="topbar">
  <div>
    <div class="brand">▦ Mini Excel</div>
    <div class="subtitle">Spreadsheet • Rumus Otomatis</div>
  </div>
  <div class="top-actions">
    <button onclick="newWorkbook()">＋ Baru</button>
    <button onclick="saveWorkbook()">💾 Simpan</button>
    <button onclick="exportCSV()">⬇ CSV</button>
  </div>
</header>

<div class="toolbar">
  <button onclick="formatCell('bold')" title="Tebal"><b>B</b></button>
  <button onclick="formatCell('italic')" title="Miring"><i>I</i></button>
  <button onclick="formatCell('underline')" title="Garis bawah">
    <u>U</u>
  </button>

  <select id="alignSelect" onchange="setAlignment(this.value)">
    <option value="left">Rata kiri</option>
    <option value="center">Rata tengah</option>
    <option value="right">Rata kanan</option>
  </select>

  <label class="color-control" title="Warna teks">
    A
    <input type="color" value="#000000"
      onchange="setCellStyle('color',this.value)">
  </label>

  <label class="color-control" title="Warna latar">
    ▰
    <input type="color" value="#ffffff"
      onchange="setCellStyle('backgroundColor',this.value)">
  </label>

  <button onclick="addRow()">＋ Baris</button>
  <button onclick="addColumn()">＋ Kolom</button>
</div>

<div class="formula-area">
  <div class="name-box" id="cellName">A1</div>
  <div class="fx">fx</div>
  <input id="formulaInput" class="formula-input"
    placeholder="Masukkan data atau rumus, contoh: =SUM(A1:A5)"
    autocomplete="off">
  <button onclick="applyFormula()">✓</button>
</div>

<div class="sheet-info">
  <span id="sheetTitle">Sheet1</span>
  <span>Klik sel untuk mengedit</span>
</div>

<div class="grid-container" id="gridContainer">
  <table id="sheetTable">
    <thead><tr id="headerRow"></tr></thead>
    <tbody id="sheetBody"></tbody>
  </table>
</div>

<div class="tabs" id="sheetTabs">
  <button class="active" onclick="switchSheet(0)">Sheet1</button>
  <button onclick="addSheet()">＋</button>
</div>

<div class="status">
  <span id="statusText">Siap</span>
  <span id="selectionInfo">Sel A1</span>
</div>

<div class="hint">
  Tips: Ketik =SUM(A1:A5) untuk menjumlahkan data.
  Tekan Enter untuk menyimpan isi sel.
</div>

<script>
const INITIAL_ROWS = 30;
const INITIAL_COLS = 12;

let rows = INITIAL_ROWS;
let cols = INITIAL_COLS;
let selected = { r: 0, c: 0 };
let sheets = [];
let activeSheet = 0;
let clipboardCell = null;

function makeSheet(name) {
  return {
    name,
    data: {},
    styles: {}
  };
}

sheets.push(makeSheet("Sheet1"));

function colName(n) {
  let s = "";
  n++;
  while (n > 0) {
    let rem = (n - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function cellId(r, c) {
  return colName(c) + (r + 1);
}

function parseCell(ref) {
  const m = /^([A-Z]+)([1-9]\d*)$/i.exec(ref.trim());
  if (!m) return null;

  let c = 0;
  for (const ch of m[1].toUpperCase()) {
    c = c * 26 + ch.charCodeAt(0) - 64;
  }

  return { r: Number(m[2]) - 1, c: c - 1 };
}

function currentSheet() {
  return sheets[activeSheet];
}

function rawValue(r, c) {
  return currentSheet().data[cellId(r, c)] ?? "";
}

function setRaw(r, c, value) {
  const id = cellId(r, c);
  if (value === "") {
    delete currentSheet().data[id];
  } else {
    currentSheet().data[id] = String(value);
  }
}

function buildGrid() {
  const header = document.getElementById("headerRow");
  const body = document.getElementById("sheetBody");

  header.innerHTML = "<th class='corner'>#</th>";
  for (let c = 0; c < cols; c++) {
    const th = document.createElement("th");
    th.textContent = colName(c);
    th.style.width = "110px";
    header.appendChild(th);
  }

  body.innerHTML = "";

  for (let r = 0; r < rows; r++) {
    const tr = document.createElement("tr");
    const th = document.createElement("th");
    th.className = "row-head";
    th.textContent = r + 1;
    tr.appendChild(th);

    for (let c = 0; c < cols; c++) {
      const td = document.createElement("td");
      td.dataset.r = r;
      td.dataset.c = c;
      td.tabIndex = 0;
      td.addEventListener("click", () => selectCell(r, c));
      td.addEventListener("focus", () => selectCell(r, c));

      td.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          selectCell(Math.min(rows - 1, r + 1), c);
          focusSelected();
        } else if (e.key === "Tab") {
          e.preventDefault();
          let nr = r, nc = c + 1;
          if (nc >= cols) { nc = 0; nr = Math.min(rows - 1, r + 1); }
          selectCell(nr, nc);
          focusSelected();
        } else if (e.key === "Delete" || e.key === "Backspace") {
          if (document.activeElement === td) {
            e.preventDefault();
            setRaw(r, c, "");
            renderValues();
          }
        } else if (e.ctrlKey && e.key.toLowerCase() === "c") {
          clipboardCell = rawValue(r, c);
        } else if (e.ctrlKey && e.key.toLowerCase() === "v") {
          if (clipboardCell !== null) {
            setRaw(r, c, clipboardCell);
            renderValues();
          }
        }
      });

      td.addEventListener("dblclick", () => {
        const value = rawValue(r, c);
        td.textContent = value;
        td.contentEditable = "true";
        td.focus();
      });

      td.addEventListener("blur", () => {
        if (td.contentEditable === "true") {
          td.contentEditable = "false";
          setRaw(r, c, td.textContent);
          renderValues();
        }
      });

      tr.appendChild(td);
    }
    body.appendChild(tr);
  }

  renderValues();
  renderTabs();
  selectCell(selected.r, selected.c, false);
}

function evaluateCell(r, c, stack = new Set()) {
  const id = cellId(r, c);
  const raw = rawValue(r, c).trim();

  if (!raw.startsWith("=")) {
    if (raw === "") return "";
    const n = Number(raw);
    return raw !== "" && Number.isFinite(n) ? n : raw;
  }

  if (stack.has(id)) return "#CIRCULAR!";
  stack.add(id);

  try {
    let expr = raw.slice(1).toUpperCase();

    // Fungsi spreadsheet: SUM, AVERAGE, MAX, MIN, COUNT
    expr = expr.replace(
      /\b(SUM|AVERAGE|AVG|MAX|MIN|COUNT)\(([^()]*)\)/g,
      (match, fn, args) => {
        let values = [];

        for (const arg of args.split(",")) {
          const range = arg.trim().match(
            /^([A-Z]+\d+):([A-Z]+\d+)$/
          );

          if (range) {
            const a = parseCell(range[1]);
            const b = parseCell(range[2]);

            if (!a || !b) throw Error("REF");

            for (let rr = Math.min(a.r,b.r);
                 rr <= Math.max(a.r,b.r); rr++) {
              for (let cc = Math.min(a.c,b.c);
                   cc <= Math.max(a.c,b.c); cc++) {
                values.push(evaluateCell(rr, cc, new Set(stack)));
              }
            }
          } else {
            const p = parseCell(arg.trim());
            if (p) {
              values.push(evaluateCell(p.r, p.c, new Set(stack)));
            } else if (arg.trim() !== "") {
              const n = Number(arg.trim());
              if (Number.isFinite(n)) values.push(n);
              else throw Error("VALUE");
            }
          }
        }

        const nums = values.filter(
          v => typeof v === "number" && Number.isFinite(v)
        );

        if (fn === "COUNT") return nums.length;
        if (fn === "SUM") return nums.reduce((a,b) => a+b, 0);
        if (fn === "AVERAGE" || fn === "AVG")
          return nums.length ? nums.reduce((a,b)=>a+b,0)/nums.length : 0;
        if (fn === "MAX") return nums.length ? Math.max(...nums) : 0;
        if (fn === "MIN") return nums.length ? Math.min(...nums) : 0;
      }
    );

    // Ganti referensi sel seperti A1 dan B5 menjadi nilainya.
    expr = expr.replace(/\b([A-Z]+\d+)\b/g, ref => {
      const p = parseCell(ref);
      if (!p) throw Error("REF");
      const v = evaluateCell(p.r, p.c, new Set(stack));
      if (v === "") return "0";
      if (typeof v !== "number" || !Number.isFinite(v))
        throw Error("VALUE");
      return String(v);
    });

    // Hanya izinkan operasi matematika dasar.
    if (!/^[\d+\-*/().\s%]+$/.test(expr))
      throw Error("FORMULA");

    const result = Function('"use strict"; return (' + expr + ')')();

    if (!Number.isFinite(result)) throw Error("DIV/0");
    return result;
  } catch (e) {
    if (String(e.message).includes("CIRCULAR")) return "#CIRCULAR!";
    if (String(e.message).includes("DIV/0")) return "#DIV/0!";
    if (String(e.message).includes("REF")) return "#REF!";
    if (String(e.message).includes("VALUE")) return "#VALUE!";
    return "#ERROR!";
  }
}

function renderValues() {
  document.querySelectorAll("#sheetBody td").forEach(td => {
    const r = Number(td.dataset.r);
    const c = Number(td.dataset.c);
    const id = cellId(r, c);
    const value = evaluateCell(r, c);

    td.textContent = value === "" ? "" : String(value);
    td.style.fontWeight = "";
    td.style.fontStyle = "";
    td.style.textDecoration = "";
    td.style.color = "";
    td.style.backgroundColor = "";
    td.style.textAlign = "left";

    const style = currentSheet().styles[id] || {};
    Object.assign(td.style, style);
  });

  updateFormulaBar();
  updateSelectionInfo();
}

function selectCell(r, c, render = true) {
  selected = { r, c };

  document.querySelectorAll("td.selected").forEach(td => {
    td.classList.remove("selected");
  });

  const cell = document.querySelector(
    `td[data-r="${r}"][data-c="${c}"]`
  );

  if (cell) cell.classList.add("selected");

  if (render) {
    updateFormulaBar();
    updateSelectionInfo();
  }
}

function focusSelected() {
  const cell = document.querySelector(
    `td[data-r="${selected.r}"][data-c="${selected.c}"]`
  );
  if (cell) {
    cell.focus();
    cell.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
}

function updateFormulaBar() {
  document.getElementById("cellName").textContent =
    cellId(selected.r, selected.c);

  document.getElementById("formulaInput").value =
    rawValue(selected.r, selected.c);
}

function updateSelectionInfo() {
  document.getElementById("selectionInfo").textContent =
    "Sel " + cellId(selected.r, selected.c);
}

function applyFormula() {
  const input = document.getElementById("formulaInput");
  setRaw(selected.r, selected.c, input.value);
  renderValues();
  setStatus("Data berhasil diperbarui");
}

document.getElementById("formulaInput").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    applyFormula();
    selectCell(Math.min(rows - 1, selected.r + 1), selected.c);
    focusSelected();
  }
});

function setStatus(message) {
  document.getElementById("statusText").textContent = message;
}

function formatCell(type) {
  const id = cellId(selected.r, selected.c);
  const styles = currentSheet().styles;
  if (!styles[id]) styles[id] = {};

  const prop = {
    bold: "fontWeight",
    italic: "fontStyle",
    underline: "textDecoration"
  }[type];

  const current = styles[id][prop];

  if (type === "bold")
    styles[id][prop] = current === "bold" ? "normal" : "bold";
  if (type === "italic")
    styles[id][prop] = current === "italic" ? "normal" : "italic";
  if (type === "underline")
    styles[id][prop] = current === "underline" ? "none" : "underline";

  renderValues();
}

function setAlignment(value) {
  setCellStyle("textAlign", value);
}

function setCellStyle(property, value) {
  const id = cellId(selected.r, selected.c);
  if (!currentSheet().styles[id]) currentSheet().styles[id] = {};
  currentSheet().styles[id][property] = value;
  renderValues();
}

function addRow() {
  rows++;
  buildGrid();
  setStatus("Baris baru ditambahkan");
}

function addColumn() {
  cols++;
  buildGrid();
  setStatus("Kolom baru ditambahkan");
}

function addSheet() {
  const name = "Sheet" + (sheets.length + 1);
  sheets.push(makeSheet(name));
  activeSheet = sheets.length - 1;
  selected = { r: 0, c: 0 };
  buildGrid();
  setStatus(name + " dibuat");
}

function switchSheet(index) {
  if (index >= sheets.length) return;
  activeSheet = index;
  selected = { r: 0, c: 0 };
  buildGrid();
}

function renderTabs() {
  const tabs = document.getElementById("sheetTabs");
  tabs.innerHTML = "";

  sheets.forEach((sheet, i) => {
    const button = document.createElement("button");
    button.textContent = sheet.name;
    button.className = i === activeSheet ? "active" : "";
    button.onclick = () => switchSheet(i);
    tabs.appendChild(button);
  });

  const add = document.createElement("button");
  add.textContent = "＋";
  add.onclick = addSheet;
  tabs.appendChild(add);

  document.getElementById("sheetTitle").textContent =
    currentSheet().name;
}

function saveWorkbook() {
  try {
    const payload = { sheets, rows, cols };
    localStorage.setItem("miniExcelWorkbook", JSON.stringify(payload));
    setStatus("Tersimpan di perangkat ini");
  } catch (e) {
    setStatus("Gagal menyimpan data");
  }
}

function loadWorkbook() {
  try {
    const saved = localStorage.getItem("miniExcelWorkbook");
    if (!saved) return;

    const payload = JSON.parse(saved);
    if (!Array.isArray(payload.sheets) || !payload.sheets.length) return;

    sheets = payload.sheets;
    rows = Math.max(INITIAL_ROWS, Number(payload.rows) || INITIAL_ROWS);
    cols = Math.max(INITIAL_COLS, Number(payload.cols) || INITIAL_COLS);
    activeSheet = 0;
  } catch (e) {
    console.log("Data simpanan tidak dapat dibuka");
  }
}

function newWorkbook() {
  if (!confirm("Buat spreadsheet baru? Data yang belum disimpan akan hilang.")) return;
  sheets = [makeSheet("Sheet1")];
  activeSheet = 0;
  rows = INITIAL_ROWS;
  cols = INITIAL_COLS;
  selected = { r: 0, c: 0 };
  buildGrid();
  setStatus("Spreadsheet baru");
}

function exportCSV() {
  const sheet = currentSheet();
  const lines = [];

  for (let r = 0; r < rows; r++) {
    const values = [];

    for (let c = 0; c < cols; c++) {
      let v = evaluateCell(r, c);
      if (v === "") v = "";

      let str = String(v);
      if (/[",\n;]/.test(str)) str = '"' + str.replace(/"/g, '""') + '"';
      values.push(str);
    }

    lines.push(values.join(","));
  }

  const blob = new Blob(
    ["\uFEFF" + lines.join("\r\n")],
    { type: "text/csv;charset=utf-8;" }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = sheet.name + ".csv";
  a.click();
  URL.revokeObjectURL(url);

  setStatus("File CSV diunduh");
}

// Navigasi dengan tombol panah.
document.addEventListener("keydown", e => {
  if (e.target.id === "formulaInput") return;
  if (e.target && e.target.isContentEditable) return;

  const moves = {
    ArrowUp: [-1, 0],
    ArrowDown: [1, 0],
    ArrowLeft: [0, -1],
    ArrowRight: [0, 1]
  };

  if (moves[e.key]) {
    e.preventDefault();
    const [dr, dc] = moves[e.key];
    selected.r = Math.max(0, Math.min(rows - 1, selected.r + dr));
    selected.c = Math.max(0, Math.min(cols - 1, selected.c + dc));
    selectCell(selected.r, selected.c);
    focusSelected();
  }
});

loadWorkbook();
buildGrid();
</script>

</body>
</html>
